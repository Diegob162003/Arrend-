<!doctype html>
<html lang="es">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #eef2ef;
      font-family: Arial, Helvetica, sans-serif;
      color: #17211d;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px"
    >
      <tr>
        <td style="padding: 32px">
          <p style="margin: 0 0 8px; font-size: 20px; font-weight: bold; color: #0f4c3a">Arrendú</p>
          <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.5">
            Escribe este código en la pantalla de ingreso. Vence en 15 minutos.
          </p>
          <p
            style="margin: 0 0 24px; font-size: 36px; font-weight: bold; letter-spacing: 8px; color: #0f4c3a"
          >
            {{ .Token }}
          </p>
          <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.5">
            ¿Abriste este correo en el mismo celular o computador?
            <a
              href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
              style="color: #0f4c3a; font-weight: bold"
              >Entra con un toque</a
            >.
          </p>
          <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #5b6b63">
            Si no pediste este código, ignora el correo: nadie puede entrar sin él.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
