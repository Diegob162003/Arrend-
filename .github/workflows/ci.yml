name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Lint, tipos y pruebas unitarias
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  base-de-datos-y-e2e:
    name: RLS y flujo completo
    runs-on: ubuntu-latest
    env:
      # Llave secreta de prueba de Cloudflare Turnstile (siempre aprueba).
      SUPABASE_AUTH_CAPTCHA_SECRET: 1x0000000000000000000000000000000AA
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # La misma versión del CLI que fija package.json: "latest" puede traer una versión mayor nueva.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase start -x studio,imgproxy,vector,logflare,realtime,edge-runtime,supavisor
      - name: Pruebas de políticas RLS (pgTAP)
        run: supabase test db
      - name: Los tipos generados están al día
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          diff -u src/lib/database.types.ts /tmp/database.types.ts
      - name: Variables de la app desde Supabase local
        run: |
          eval "$(supabase status -o env 2>/dev/null | grep -E '^(API_URL|PUBLISHABLE_KEY)=')"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
